services:
  postgres:
    image: postgres:15
    container_name: atomquest-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-atomquest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: atomquest-backend
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: atomquest-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - .env
    restart: unless-stopped

volumes:
  pgdata:
